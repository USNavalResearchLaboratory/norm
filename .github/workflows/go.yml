name: Go

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Go bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # The bindings link libnorm via `#cgo pkg-config: norm`. ./waf --build-go
      # writes a norm.pc into build/pkgconfig pointing at the in-tree libraries.
      PKG_CONFIG_PATH: ${{ github.workspace }}/build/pkgconfig
      # Dynamic linking: let the loader find libnorm/libprotokit at test time.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build:${{ github.workspace }}/build/protolib
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build:${{ github.workspace }}/build/protolib
      CGO_ENABLED: "1"

    defaults:
      run:
        working-directory: ./src/go

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: 3.x

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # Build the native NORM library (and generate build/pkgconfig/norm.pc) via the
    # waf --build-go hook. Go must already be on PATH: `configure --build-go`
    # probes for the toolchain. Runs from the repo root, not ./src/go.
    - name: Build NORM (with Go hook)
      run: ./waf configure --build-go && ./waf build
      working-directory: .

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || { echo 'gofmt needed on:'; gofmt -l .; exit 1; }

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    # Portable unit tests: link libnorm but do not touch the network.
    - name: Test
      run: go test -race ./...

    # Reliable-transfer round-trips over multicast loopback. Best-effort: loopback
    # delivery is not guaranteed on hosted runners, so this is non-blocking but
    # still surfaces regressions when it does run.
    - name: Integration tests (multicast loopback)
      run: go test -tags norm_integration ./...
      continue-on-error: true
